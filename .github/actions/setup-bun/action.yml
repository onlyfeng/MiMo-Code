name: "Setup Bun"
description: "Setup the pinned Bun, cache dependencies, and install from bun.lock"
runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Cache Bun dependencies
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Expose bundled native build tool
      shell: bash
      run: |
        set -euo pipefail
        node_gyp="$(npm root -g)/npm/node_modules/node-gyp/bin/node-gyp.js"
        test -x "$node_gyp"
        native_tools="$(mktemp -d "$RUNNER_TEMP/mimocode-native-tools.XXXXXX")"
        ln -s "$node_gyp" "$native_tools/node-gyp"
        echo "$native_tools" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: bun ci
      shell: bash
