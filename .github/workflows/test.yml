name: test

# GitHub disabled this fork's workflows for Actions usage, most of it from
# pull_request test runs on every PR push. Tests run on pushes to the
# integration branches and on manual dispatch. A pull request from a branch of
# this repository runs no job; dispatch on its branch
# (`gh workflow run test.yml --ref <branch>`) when pre-merge evidence is needed.
# A pull request from another repository cannot be dispatched by ref, so its
# jobs still run (`if: ...head.repo.full_name != github.repository`).
# Docs-only changes start no run: no test, lint or typecheck input lives in docs/.
on:
  push:
    branches: [main, dev, dev/compat]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main, dev, dev/compat]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
    inputs:
      windows_runtime:
        description: Run the Windows runtime acceptance entry on this ref
        type: boolean
        required: false
        default: false
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    name: unit (shard ${{ matrix.shard }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "ci@mimo.ai"
          git config --global user.name "mimo-ci"

      # MCP SDK mock suites run in separate processes to preserve ManagedClient
      # class identity and real transport consumers.
      # stdio-exit-observe.test.ts excluded from shards: it needs the real
      # ObservingStdioTransport. lifecycle.test.ts mock.module's that path
      # process-wide, so sharing a bun test process with it always breaks
      # these tests. It runs in the dedicated job below.
      # Resume negatives run separately: upstream traced shared log-queue stalls
      # to detached work from this suite. Other recovery suites stay in shards.
      # Bus integration runs separately for the same stall: on Linux, its busy-SSE
      # disposal cases leave a log write whose callback never arrives, so every
      # later bounded flush costs its full budget and Log.init never returns
      # (lsp/client, which shares this file's hash shard).
      # Provider refresh suites check process-wide instance idleness, so each runs
      # in its own process away from session fixtures that leave detached
      # notification/wake work alive.
      #
      # Sharding is path-hash, NOT list position: `NR % n` on the sorted file
      # list reassigns every later file when one is added/removed, which
      # reshuffles process-wide mocks and breaks order-sensitive tests
      # (e.g. mcp/sampling-e2e). hash(path) % n keeps each file's shard
      # independent of its neighbors.
      #
      # Scope: this stabilizes shard membership and isolates the file that
      # actually broke. It is NOT a general process-state isolation scheme —
      # other files that mock.module still share a bun test process with their
      # shard neighbors. If a new mock lands on the same hash bucket as a test
      # that needs the real implementation, isolate that file the same way as
      # stdio-exit-observe rather than assuming hash-sharding alone is enough.
      # Step budget: shard 1 takes ~450s (412-488s observed across five pushes on
      # 2026-09-15), so an 8-minute step cancelled two runs that had already
      # printed a complete passing summary. 12 minutes absorbs runner variance
      # while still bounding a hung shard; per-test hangs stay capped by the
      # `--timeout 120000` below.
      - name: Run unit tests (shard ${{ matrix.shard }})
        timeout-minutes: 12
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" shard '${{ matrix.shard }}'

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-shard-${{ strategy.job-index }}
          path: packages/cli/.artifacts/unit/junit.xml
          if-no-files-found: error

  mcp-mock-suites:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run MCP SDK mock suites in independent processes
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" isolated mcp-mocks .artifacts/mcp-mocks

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-mcp-mocks
          path: packages/cli/.artifacts/mcp-mocks/*.xml
          if-no-files-found: error

  provider-refresh:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run provider refresh suites in independent processes
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" isolated provider-refresh .artifacts/provider-refresh

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-provider-refresh
          path: packages/cli/.artifacts/provider-refresh/*.xml
          if-no-files-found: error

  stdio-exit-observe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run stdio exit observer tests
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" isolated stdio-exit-observe .artifacts/unit

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-stdio-exit-observe
          path: packages/cli/.artifacts/unit/junit.xml
          if-no-files-found: error

  subagent-resume-negatives:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run resume negatives in an independent process
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" isolated resume-negatives .artifacts/resume-negatives

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-resume-negatives
          path: packages/cli/.artifacts/resume-negatives/junit.xml
          if-no-files-found: error

  bus-integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run bus integration in an independent process
        shell: bash
        working-directory: packages/cli
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-cli-tests.sh" isolated bus-integration .artifacts/bus-integration

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-bus-integration
          path: packages/cli/.artifacts/bus-integration/junit.xml
          if-no-files-found: error

  windows-runtime:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/compat') ||
      (github.event_name == 'workflow_dispatch' && inputs.windows_runtime)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Record and validate Windows runtime
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "packages/cli/.artifacts/windows-runtime"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $bunVersion = bun --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageManager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
          $environment = [ordered]@{
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            runner_os = $env:RUNNER_OS
            bun = $bunVersion.Trim()
            package_manager = $packageManager
            powershell = $PSVersionTable.PSVersion.ToString()
            github_sha = $env:GITHUB_SHA
            checkout_sha = $checkoutSha.Trim()
          }
          $environment | ConvertTo-Json | Tee-Object -FilePath (Join-Path $artifacts "workflow-environment.json")
          if (-not $IsWindows) { throw "Windows runtime acceptance requires Windows" }
          if ($packageManager -notmatch '^bun@(.+)$') {
            throw "Windows runtime acceptance requires a Bun packageManager declaration"
          }
          if ($environment.bun -ne $Matches[1]) {
            throw "Installed Bun does not match the packageManager declaration"
          }
          if (-not (Test-Path -Path "packages/cli/script/verify-windows-runtime.ts" -PathType Leaf)) {
            throw "Missing compat Windows runtime acceptance entry"
          }

      - name: Install locked dependencies
        run: |
          bun ci 2>&1 | Tee-Object -FilePath "packages/cli/.artifacts/windows-runtime/workflow-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows runtime
        working-directory: packages/cli
        run: |
          foreach ($selector in @(
            "MIMOCODE_EXPERIMENTAL",
            "MIMOCODE_MCP_TOOL_SEARCH",
            "MIMOCODE_CODEX_MODE",
            "MIMOCODE_EXPERIMENTAL_WORKFLOW_TOOL",
            "MIMOCODE_EXPERIMENTAL_WORKSPACES",
            "MIMOCODE_COMPACTION_MAX_CONTEXT",
            "MIMOCODE_COMPACTION_TRIGGER_RATIO",
            "MIMOCODE_DISABLE_CHECKPOINT"
          )) {
            Remove-Item "Env:$selector" -ErrorAction SilentlyContinue
          }
          bun script/verify-windows-runtime.ts 2>&1 | Tee-Object -FilePath ".artifacts/windows-runtime/workflow-runtime.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows launcher extraction
        working-directory: packages/cli
        run: |
          bun test test/installation/launcher.test.ts --timeout 120000 2>&1 | Tee-Object -FilePath ".artifacts/windows-runtime/workflow-launcher.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/cli/.artifacts/windows-runtime/
          if-no-files-found: error

  release-script:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Root-level script tests run from the repository root, whose bunfig.toml
      # scopes discovery to script/ and refuses packages/** test paths.
      - name: Run release script tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/release-script
          report=.artifacts/release-script/junit.xml
          rm -f -- "$report"
          bun test script/release.test.ts script/build-provenance.test.ts --timeout 120000 \
            --reporter=junit --reporter-outfile="$report"
          test -s "$report"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-junit.py" \
            "$report" script/release.test.ts script/build-provenance.test.ts

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-release-script
          path: .artifacts/release-script/junit.xml
          if-no-files-found: error
