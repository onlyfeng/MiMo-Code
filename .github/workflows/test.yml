name: test

on:
  push:
    branches: [main, dev, dev/compat]
  pull_request:
    branches: [main, dev, dev/compat]
  workflow_dispatch:
    inputs:
      windows_runtime:
        description: Run the Windows runtime acceptance entry on this ref
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    name: unit (shard ${{ matrix.shard }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "ci@mimo.ai"
          git config --global user.name "mimo-ci"

      # stdio-exit-observe.test.ts excluded from shards: it needs the real
      # ObservingStdioTransport. lifecycle.test.ts mock.module's that path
      # process-wide, so sharing a bun test process with it always breaks
      # these tests. It runs in the dedicated job below.
      # session-actor-recovery.test.ts also needs a dedicated process: it
      # exercises the real AppRuntime prefix captor, while focused prompt
      # layers in unit tests replace and dispose that process-wide reference.
      #
      # Sharding is path-hash, NOT list position: `NR % n` on the sorted file
      # list reassigns every later file when one is added/removed, which
      # reshuffles process-wide mocks and breaks order-sensitive tests
      # (e.g. mcp/sampling-e2e). hash(path) % n keeps each file's shard
      # independent of its neighbors.
      #
      # Scope: this stabilizes shard membership and isolates the file that
      # actually broke. It is NOT a general process-state isolation scheme —
      # other files that mock.module still share a bun test process with their
      # shard neighbors. If a new mock lands on the same hash bucket as a test
      # that needs the real implementation, isolate that file the same way as
      # stdio-exit-observe rather than assuming hash-sharding alone is enough.
      # Step budget: shard 1 takes ~450s (412-488s observed across five pushes on
      # 2026-09-15), so an 8-minute step cancelled two runs that had already
      # printed a complete passing summary. 12 minutes absorbs runner variance
      # while still bounding a hung shard; per-test hangs stay capped by the
      # `--timeout 120000` below.
      - name: Run unit tests (shard ${{ matrix.shard }})
        timeout-minutes: 12
        shell: bash
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          shard='${{ matrix.shard }}'
          idx="${shard%/*}"
          n="${shard#*/}"

          mapfile -d '' discovered < <(
            find test -type f \( -name '*.test.ts' -o -name '*.test.tsx' \) -print0 | sort -z
          )
          zero_case_files=(
            test/config/plugin.test.ts
            test/provider/gitlab-duo.test.ts
            test/pty/pty-shell.test.ts
          )

          has_tsx=0
          has_runtime=0
          has_stdio=0
          has_actor_recovery=0
          files=()
          reported_files=()

          for f in "${zero_case_files[@]}"; do
            found=0
            for candidate in "${discovered[@]}"; do
              if [[ "$candidate" == "$f" ]]; then
                found=1
                break
              fi
            done
            if (( !found )); then
              echo "::error::zero-case allowlist entry is not discoverable: $f"
              exit 1
            fi
          done

          for f in "${discovered[@]}"; do
            [[ "$f" == *.test.tsx ]] && has_tsx=1
            [[ "$f" == test/workflow/runtime-worktree.test.ts ]] && has_runtime=1

            if [[ "$f" == test/mcp/stdio-exit-observe.test.ts ]]; then
              has_stdio=1
              continue
            fi
            if [[ "$f" == test/server/session-actor-recovery.test.ts ]]; then
              has_actor_recovery=1
              continue
            fi

            h="$(printf '%s' "$f" | cksum | awk '{print $1}')"
            if (( h % n == idx - 1 )); then
              files+=("$f")
              case "$f" in
                test/config/plugin.test.ts | \
                test/provider/gitlab-duo.test.ts | \
                test/pty/pty-shell.test.ts) ;;
                *) reported_files+=("$f") ;;
              esac
            fi
          done

          if (( !has_tsx || !has_runtime || !has_stdio || !has_actor_recovery )); then
            echo "::error::discovery contract lost: tsx=$has_tsx runtime=$has_runtime stdio=$has_stdio actor_recovery=$has_actor_recovery"
            exit 1
          fi

          if (( ${#files[@]} == 0 )); then
            echo "::error::shard $shard received zero files"
            exit 1
          fi
          if (( ${#reported_files[@]} == 0 )); then
            echo "::error::shard $shard expects zero JUnit suites"
            exit 1
          fi

          mkdir -p .artifacts/unit
          report=.artifacts/unit/junit.xml
          rm -f -- "$report"
          bun test "${files[@]}" \
            --timeout 120000 \
            --reporter=junit \
            --reporter-outfile="$report"
          test -s "$report"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-junit.py" \
            "$report" "${reported_files[@]}"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-shard-${{ strategy.job-index }}
          path: packages/opencode/.artifacts/unit/junit.xml
          if-no-files-found: error

  stdio-exit-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run stdio exit observer tests
        shell: bash
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          mkdir -p .artifacts/unit
          report=.artifacts/unit/junit.xml
          rm -f -- "$report"
          bun test test/mcp/stdio-exit-observe.test.ts --timeout 120000 \
            --reporter=junit --reporter-outfile="$report"
          test -s "$report"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-junit.py" \
            "$report" test/mcp/stdio-exit-observe.test.ts

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-stdio-exit-observe
          path: packages/opencode/.artifacts/unit/junit.xml
          if-no-files-found: error

  session-actor-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run HTTP actor recovery tests with the real application runtime
        shell: bash
        working-directory: packages/opencode
        run: |
          set -euo pipefail
          mkdir -p .artifacts/unit
          report=.artifacts/unit/junit.xml
          rm -f -- "$report"
          bun test test/server/session-actor-recovery.test.ts --timeout 120000 \
            --reporter=junit --reporter-outfile="$report"
          test -s "$report"
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-junit.py" \
            "$report" test/server/session-actor-recovery.test.ts

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-session-actor-recovery
          path: packages/opencode/.artifacts/unit/junit.xml
          if-no-files-found: error

  windows-runtime:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev/compat') ||
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev/compat') ||
      (github.event_name == 'workflow_dispatch' && inputs.windows_runtime)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Record and validate Windows runtime
        env:
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifacts = Join-Path $env:GITHUB_WORKSPACE "packages/opencode/.artifacts/windows-runtime"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $bunVersion = bun --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkoutSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packageManager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
          $environment = [ordered]@{
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            runner_os = $env:RUNNER_OS
            bun = $bunVersion.Trim()
            package_manager = $packageManager
            powershell = $PSVersionTable.PSVersion.ToString()
            github_sha = $env:GITHUB_SHA
            checkout_sha = $checkoutSha.Trim()
            pull_request_head_sha = $env:PULL_REQUEST_HEAD_SHA
          }
          $environment | ConvertTo-Json | Tee-Object -FilePath (Join-Path $artifacts "workflow-environment.json")
          if (-not $IsWindows) { throw "Windows runtime acceptance requires Windows" }
          if ($packageManager -notmatch '^bun@(.+)$') {
            throw "Windows runtime acceptance requires a Bun packageManager declaration"
          }
          if ($environment.bun -ne $Matches[1]) {
            throw "Installed Bun does not match the packageManager declaration"
          }
          if (-not (Test-Path -Path "packages/opencode/script/verify-windows-runtime.ts" -PathType Leaf)) {
            throw "Missing compat Windows runtime acceptance entry"
          }

      - name: Install locked dependencies
        run: |
          bun ci 2>&1 | Tee-Object -FilePath "packages/opencode/.artifacts/windows-runtime/workflow-install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows runtime
        working-directory: packages/opencode
        run: |
          foreach ($selector in @(
            "MIMOCODE_EXPERIMENTAL",
            "MIMOCODE_EXPERIMENTAL_MCP_TOOL_SEARCH",
            "MIMOCODE_CODEX_MODE",
            "MIMOCODE_EXPERIMENTAL_WORKFLOW_TOOL",
            "MIMOCODE_EXPERIMENTAL_WORKSPACES",
            "MIMOCODE_COMPACTION_MAX_CONTEXT",
            "MIMOCODE_COMPACTION_TRIGGER_RATIO",
            "MIMOCODE_DISABLE_CHECKPOINT"
          )) {
            Remove-Item "Env:$selector" -ErrorAction SilentlyContinue
          }
          bun script/verify-windows-runtime.ts 2>&1 | Tee-Object -FilePath ".artifacts/windows-runtime/workflow-runtime.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/opencode/.artifacts/windows-runtime/
          if-no-files-found: error
