name: typecheck

# Docs-only changes start no run: no lint or typecheck input lives in docs/.
on:
  push:
    branches: [main, dev, dev/compat]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main, dev, dev/compat]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
